name: Developer Learning Lab

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python scripts
        run: |
          python3 -m py_compile scripts/complete_challenge.py
          python3 -m py_compile scripts/dashboard.py
          python3 -m py_compile scripts/daily_challenge.py
          python3 -m py_compile scripts/git_automation.py

      - name: Install test dependencies
        run: python3 -m pip install pytest

      - name: Run tests
        run: python3 -m pytest -v

      - name: Validate project data
        run: python3 scripts/validate_project.py

      - name: Check Git whitespace
        run: git diff --check

      - name: Generate dashboard
        run: python3 scripts/dashboard.py

      - name: Verify generated files
        run: git diff --exit-code

      - name: Validate project data
        run: python3 scripts/validate_project.py

      - name: Generate dashboard
        run: python3 scripts/dashboard.py

      - name: Verify dashboard
        run: |
          test -f dashboard/index.html
          test -s dashboard/index.html
          grep -q "Developer Learning Lab" dashboard/index.html
